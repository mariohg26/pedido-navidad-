<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Panel pedidos Navidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:wght@700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Panel de Mario: pedidos de Navidad guardados desde la página de clientes. Totales por proveedor para pedir a fábrica. */
:root{--bg:#f3f5f1;--card:#fff;--ink:#16241d;--muted:#5b6b62;--line:#dde4de;--pine:#103526;--pine-2:#1a4a36;--gold:#b98a2e;--holly:#a3232b;--ok:#1e7a46;--chip:#e7eee9;--new:#fbf2dc;
  --display:"Cormorant",Georgia,serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1611;--card:#13221a;--ink:#e8efe9;--muted:#9fb2a6;--line:#24372c;--pine:#0a2a1d;--pine-2:#123d2b;--gold:#e2bc69;--holly:#e0656b;--ok:#4cc27e;--chip:#1c2f24;--new:#2f2a16;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1611;--card:#13221a;--ink:#e8efe9;--muted:#9fb2a6;--line:#24372c;--pine:#0a2a1d;--pine-2:#123d2b;--gold:#e2bc69;--holly:#e0656b;--ok:#4cc27e;--chip:#1c2f24;--new:#2f2a16;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--body)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--pine);color:#f2efe4;padding:calc(14px + env(safe-area-inset-top,0px)) 0 14px}
header .wrap{display:flex;align-items:center;gap:10px;justify-content:space-between}
h1{font-family:var(--display);font-size:28px;margin:0;line-height:1.05}
header small{display:block;color:#c8d6cd;font-size:12.5px}
button,select,input{font:inherit}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--pine-2);border-color:var(--pine-2);color:#fff}
.btn.wa{background:#1ea952;border-color:#1ea952;color:#fff}
header .btn{background:transparent;color:#f2efe4;border-color:rgba(233,196,106,.5)}
.login{max-width:360px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.login label{display:block;font-weight:600;margin-bottom:6px}
.login input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px;margin-bottom:12px}
.err{color:var(--holly);font-size:13.5px;min-height:1em}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 8px}
.bar select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);max-width:100%}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:0;background:none;color:var(--muted);padding:10px 12px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.prov{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;margin-bottom:14px}
.prov h2{font-family:var(--display);font-size:24px;margin:0 0 2px}
.prov .sub{color:var(--muted);font-size:13px;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
td .f{display:block;color:var(--muted);font-size:12.5px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ped{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.ped.nuevo{background:var(--new);border-color:var(--gold)}
.ped.anulado{opacity:.55}
.ped .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ped .neg{font-weight:700;font-size:16px}
.ped .meta{color:var(--muted);font-size:12.5px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;border-radius:6px;padding:2px 7px;background:var(--chip)}
.tag.nuevo{background:var(--gold);color:#1d2a22}.tag.anulado{background:var(--holly);color:#fff}
.ped ul{margin:8px 0 0;padding-left:18px}
.ped li{margin:2px 0}
.ped .obs{margin-top:6px;font-size:13.5px;background:var(--bg);border-radius:8px;padding:6px 8px}
.vacio{color:var(--muted);text-align:center;padding:30px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pine);color:#fff;padding:10px 16px;border-radius:20px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.plazo{font-size:13px;background:var(--new);border:1px solid var(--gold);border-radius:10px;padding:7px 10px;margin:4px 0 10px}
.buscar{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--ink);font-size:16px;margin-bottom:10px}
#doc{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;color:#000}
  header,#app,#login,.toast{display:none!important}
  #doc{display:block;font:11pt/1.35 var(--body);color:#000}
  #doc .dh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #103526;padding-bottom:10px;margin-bottom:14px}
  #doc .dh img{height:46px}
  #doc h1{font-family:var(--display);font-size:26pt;margin:0;color:#103526}
  #doc .dm{text-align:right;font-size:10pt}
  #doc .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;font-size:10pt}
  #doc .two div{border:1px solid #bbb;border-radius:6px;padding:8px 10px}
  #doc .two b{display:block;font-size:8.5pt;letter-spacing:.8px;text-transform:uppercase;color:#555;margin-bottom:3px}
  #doc table{font-size:10.5pt}#doc th{color:#333;border-bottom:1.5px solid #103526}#doc td{border-bottom:1px solid #ccc}
  #doc .pie{margin-top:18px;font-size:9.5pt;color:#333}
}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ped .tag.mod{background:var(--chip);color:var(--pine-2)}
.ed{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.ed .fila{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.ed .fila .nm{flex:1;min-width:0}.ed .fila .nm small{display:block;color:var(--muted);font-size:12.5px}
.ed .q{display:flex;align-items:center;gap:4px;flex-shrink:0}
.ed .q button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;font-weight:700;cursor:pointer}
.ed .q input{width:48px;height:34px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:16px}
.ed .q .u{font-size:12px;color:var(--muted);width:40px}
.ed .x{border:0;background:none;color:var(--holly);font-size:13px;font-weight:700;cursor:pointer;padding:6px}
.ed .fila.cero .nm{text-decoration:line-through;opacity:.6}
.ed label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin:12px 0 4px}
.ed select,.ed textarea,.ed .bus{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.ed textarea{min-height:60px}
.ed .res button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);padding:9px 4px;cursor:pointer;font:inherit}
.ed .res button small{color:var(--muted)}
.ed .aviso{font-size:12.5px;color:var(--muted);margin-top:8px}
.ped details{margin-top:6px;font-size:13px;color:var(--muted)}.ped details ul{margin-top:4px}
/* pestaña de visitas: quién ha entrado en la página de pedidos */
.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{white-space:nowrap;flex:none}
.vkp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.vfil{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.vfil button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}
.vfil button[aria-pressed="true"]{background:var(--pine-2);border-color:var(--pine-2);color:#fff}
.vis{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.vis .neg{font-weight:700;font-size:15.5px;overflow-wrap:anywhere}
.vis .meta{color:var(--muted);font-size:12.5px}
.vis.sinped{border-color:var(--gold);background:var(--new)}
.vis .tag{flex:none;white-space:nowrap}
.tag.ok{background:var(--ok);color:#fff}.tag.mira{background:var(--gold);color:#1d2a22}
/* pestaña de carritos sin enviar (solo la ve Mario) */
.tabs .cnt{display:inline-block;min-width:20px;padding:1px 6px;margin-left:5px;border-radius:10px;background:var(--holly);color:#fff;font-size:12px;line-height:18px;text-align:center}
.car{background:var(--new);border:1px solid var(--gold);border-radius:14px;padding:12px;margin-bottom:10px}
.car.hecho{background:var(--card);border-color:var(--line);opacity:.7}
.car .neg{font-weight:700;font-size:16px;overflow-wrap:anywhere}.car .neg.anon{color:var(--muted);font-style:italic}
.car .meta{color:var(--muted);font-size:12.5px}
.car .tag{flex:none;white-space:nowrap;align-self:flex-start}
.car ul{margin:8px 0 0;padding-left:18px}.car li{margin:2px 0}
.car .cto{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.prov tr.sinb td{border-bottom:0;padding-bottom:2px}.prov td.fabtd{padding-top:0}
.fab label{white-space:nowrap}
.fab{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px;font-size:13px}
.fab label{display:flex;align-items:center;gap:6px;color:var(--muted)}
.fab input{width:64px;padding:6px 8px;border:1px solid var(--gold);border-radius:8px;background:var(--new);color:var(--ink);font-size:16px;text-align:center}
.queda{font-weight:700;border-radius:10px;padding:2px 8px;white-space:nowrap}
.queda.ok{background:#e3f3e8;color:#17663a}.queda.mal{background:#fbe3e4;color:#a3232b}.queda.nada{background:var(--chip);color:var(--muted);font-weight:600}
@media (prefers-color-scheme: dark){.queda.ok{background:#173a26;color:#7fe0a5}.queda.mal{background:#3d1b1d;color:#ff9da2}}
.faltan{background:#fbe3e4;color:#a3232b;border-radius:10px;padding:8px 10px;font-size:13.5px;font-weight:600;margin:6px 0}
.cubierto{background:#e3f3e8;color:#17663a;border-radius:10px;padding:8px 10px;font-size:13.5px;font-weight:600;margin:6px 0}
.fadd{margin-top:8px}.fadd .fbus{width:100%;padding:9px 12px;border:1px dashed var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:15px}
.fres button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);padding:8px 4px;cursor:pointer;font:inherit}.fres small{color:var(--muted)}
.carnota{font-size:13px;color:var(--muted);margin:0 0 10px}
.btn.conf{background:var(--ok);border-color:var(--ok);color:#fff}
.vanon{color:var(--muted);font-size:13px;text-align:center;margin:12px 0 4px}
.cto{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 2px}.cto .btn{padding:4px 10px;font-size:13px;text-decoration:none}.sintel{color:#b45309}
</style>
</head>
<body>
<header><div class="wrap"><div><h1>Pedidos de Navidad</h1><small>Panel de Quesos Maher · solo para ti</small></div><button class="btn" id="recargar" hidden>↻ Actualizar</button></div></header>

<div class="login" id="login">
  <label for="clave">Clave del panel</label>
  <input id="clave" type="password" autocomplete="current-password">
  <button class="btn pri" id="entrar" style="width:100%">Entrar</button>
  <p class="err" id="err"></p>
</div>

<main class="wrap" id="app" hidden>
  <div class="bar">
    <select id="semana" aria-label="Semana de entrega"></select>
    <label style="font-size:13.5px"><input type="checkbox" id="soloNuevos"> Solo los no marcados como pasados a fábrica</label>
  </div>
  <div class="kpis"><div class="kpi"><b id="kPed">0</b><span>pedidos</span></div><div class="kpi"><b id="kCli">0</b><span>clientes</span></div><div class="kpi"><b id="kNue">0</b><span>sin pasar a fábrica</span></div></div>
  <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-t="prov">Por proveedor</button><button role="tab" aria-selected="false" data-t="ped">Pedidos de clientes</button><button role="tab" aria-selected="false" data-t="vis">Han visto la tienda</button><button role="tab" aria-selected="false" data-t="car">Carritos sin enviar<span class="cnt" id="nCar" hidden>0</span></button></div>
  <section id="tprov"></section>
  <section id="tped" hidden></section>
  <section id="tvis" hidden></section>
  <section id="tcar" hidden></section>
</main>
<div class="toast" id="toast" hidden></div>
<div id="doc"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const SB='https://ibxctgusajrpjhvvxeiq.supabase.co',SBK='sb_publishable_zGZx3EHAH6Xu62EYzlhJFQ_MsZ5304j';
const PROV=['Capdevila',"Cuit's",'La Victoria'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fq=x=>String(+(+x).toFixed(1)).replace('.',',');
const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const porDia=(a,b)=>(+(/(\d+)/.exec(a)||[0,99])[1])-(+(/(\d+)/.exec(b)||[0,99])[1]);
const hoy=()=>new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});
// Capdevila recibe pedidos los jueves antes de las 13:00 y entrega el lunes de dos semanas después
function plazoCapdevila(){
  const d=new Date(),dd=(4-d.getDay()+7)%7;let j=new Date(d.getFullYear(),d.getMonth(),d.getDate()+dd);
  if(dd===0&&d.getHours()>=13)j.setDate(j.getDate()+7);
  const l=new Date(j);l.setDate(j.getDate()+11);const f=x=>x.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  return `<div class="plazo">📅 Próximo pedido a Capdevila: <b>${f(j)} antes de las 13:00</b> · llega el ${f(l)}. Último para Navidad: jueves 10 de diciembre.</div>`;
}
// documento para imprimir o guardar en PDF (pedido de compra a fábrica u hoja de un cliente)
function imprimir(tit,quien,filas,entrega,p){
  const num=p?`Ref. ${p.ref}`:`PC-${new Date().toISOString().slice(2,10).replace(/-/g,'')}-${quien.replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()}`;
  const kg=filas.reduce((s,t)=>s+(t.l&&t.l.modo==='kg'&&t.l.peso?t.q*t.l.peso:0),0);
  $('doc').innerHTML=`<div class="dh"><div><img src="img/logo.png" alt="Quesos Maher"><h1>${tit}</h1></div><div class="dm"><b>${esc(num)}</b><br>Fecha: ${hoy()}</div></div>
  <div class="two"><div><b>${p?'Cliente':'Proveedor'}</b>${esc(quien)}${p&&(p.contacto||p.localidad)?`<br>${esc([p.contacto,p.localidad].filter(Boolean).join(' · '))}`:''}${p&&p.telefono?`<br>Tel. ${esc(p.telefono)}`:''}${p&&p.obs?`<br><i>${esc(p.obs)}</i>`:''}</div><div><b>${p?'Servir':'Comprador'}</b>${p?esc(entrega):'Quesos Maher · Mariano Hernández Martín<br>Salamanca · WhatsApp 622 853 727<br>pedidos.quesosmaher@gmail.com'}</div></div>
  ${p?'':`<p style="margin:0 0 10px"><b>Entrega solicitada:</b> ${esc(entrega)}</p>`}
  <table><thead><tr><th>Producto</th><th>Formato</th><th style="text-align:right">Cantidad</th>${p?'<th style="text-align:right">Preparado</th>':''}</tr></thead><tbody>
  ${filas.map(t=>t.h?`<tr><td colspan="${p?4:3}" style="padding-top:12px;font-weight:700;color:#103526">${esc(t.h)}</td></tr>`:`<tr><td>${esc(t.l.n)}</td><td>${esc(t.l.d)}</td><td class="n">${esc(cant(t.l,t.q))}${t.l.modo==='kg'&&t.l.peso?`<br><small>aprox. ${fq(t.q*t.l.peso)} kg</small>`:''}</td>${p?'<td class="n">☐</td>':''}</tr>`).join('')}
  </tbody></table>${kg?`<p class="pie">Peso aproximado de las piezas: ${fq(kg)} kg.</p>`:''}
  <p class="pie">${p?'Precios según tarifa de Navidad 2026; las piezas se facturan por el peso real servido.':'Rogamos confirmación del pedido y de la fecha de entrega. Gracias.'}</p>`;
  setTimeout(()=>window.print(),150);
}
const st={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let CLAVE='',PED=[],CAT=[],ED=null,FAB={},FEXTRA=[];
const SEMANAS=['Semana del 9 al 12 de diciembre','Semana del 14 al 19 de diciembre','Semana del 21 al 24 de diciembre'];
fetch('catalogo.json').then(r=>r.json()).then(c=>CAT=c).catch(()=>{});
async function rpc(fn,body){
  const r=await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',headers:{'Content-Type':'application/json',apikey:SBK},body:JSON.stringify(body)});
  if(!r.ok){const t=await r.text();throw new Error(/clave incorrecta/.test(t)?'Clave incorrecta':'No se ha podido conectar. Prueba otra vez.')}
  const t=await r.text();return t?JSON.parse(t):null;
}
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>e.hidden=true,2200)}
async function cargar(){
  PED=await rpc('web_panel_pedidos',{clave:CLAVE})||[];
  try{VIS=await rpc('web_panel_visitas',{clave:CLAVE})||[]}catch(e){VIS=null}
  try{CAR=await rpc('web_panel_carritos',{clave:CLAVE})||[]}catch(e){CAR=null}
  try{FAB=await rpc('web_panel_fabrica',{clave:CLAVE})||{}}catch(e){FAB={}}
  const sems=[...new Set(PED.map(p=>p.entrega))].sort(porDia);
  const cur=$('semana').value;
  $('semana').innerHTML='<option value="">Todas las semanas</option>'+sems.map(s=>`<option ${s===cur?'selected':''}>${esc(s)}</option>`).join('');
  pintar();if(!$('tvis').hidden)pintarVis();pintarCar();
}
async function entrar(){
  CLAVE=$('clave').value.trim();if(!CLAVE)return;$('err').textContent='';$('entrar').disabled=true;
  try{await cargar();st.set('maher_panel_clave',CLAVE);$('login').hidden=true;$('app').hidden=false;$('recargar').hidden=false}
  catch(e){$('err').textContent=e.message}
  $('entrar').disabled=false;
}
const unidad=(l,q)=>l.modo==='kg'?(q===1?'pieza':'piezas'):l.caja?(q===1?'caja':'cajas'):(q===1?'ud':'uds');
const cant=(l,q)=>l.modo!=='kg'&&l.caja?`${q} ${unidad(l,q)} de ${l.caja} uds (${q*l.caja} uds)`:l.modo==='kg'&&l.caja?`${q} ${unidad(l,q)} (${Math.ceil(q/l.caja)} ${Math.ceil(q/l.caja)===1?'caja':'cajas'} de ${l.caja})`:`${q} ${unidad(l,q)}`;
function visibles(){const s=$('semana').value,sn=$('soloNuevos').checked;return PED.filter(p=>p.estado!=='anulado'&&(!s||p.entrega===s)&&(!sn||p.estado==='nuevo'))}
function totales(lista){
  const T={};
  lista.forEach(p=>(p.lineas||[]).forEach(l=>{
    const m=PROV.includes(l.m)?l.m:'Otros',k=l.id||(l.n+'|'+l.d);

function faltaPorPedir(m){
  const vivos=PED.filter(p=>p.estado!=='anulado'),sel=$('semana').value,resto={};
  const sems=[...new Set(vivos.map(p=>p.entrega))].sort(porDia).map(se=>{
    const T=totales(vivos.filter(p=>p.entrega===se))[m]||{};
    const filas=Object.entries(T).map(([k,t])=>{const cub=Math.min(t.q,resto[k]??=(FAB[k]??0));resto[k]-=cub;return {l:t.l,q:t.q-cub}})
      .filter(t=>t.q>0).sort((a,b)=>a.l.n.localeCompare(b.l.n,'es'));
    return {se,filas}}).filter(x=>x.filas.length&&(!sel||x.se===sel));
  const tot={};sems.forEach(x=>x.filas.forEach(t=>{const k=t.l.id||(t.l.n+'|'+t.l.d);tot[k]=tot[k]?{l:t.l,q:tot[k].q+t.q}:{l:t.l,q:t.q}}));
  return {sems,filas:Object.values(tot).sort((a,b)=>a.l.n.localeCompare(b.l.n,'es'))};
}

  if($('tcar').hidden)return;
  if(CAR===null){$('tcar').innerHTML='<p class="vacio">No se han podido cargar los carritos. Pulsa ↻ Actualizar.</p>';return}
  const orden=[...CAR].sort((a,b)=>(!!a.gestionado-!!b.gestionado)||(new Date(b.actualizado)-new Date(a.actualizado)));
  $('tcar').innerHTML=`<p class="carnota">Clientes que han metido productos en el carrito y <b>no han enviado</b> el pedido. Solo lo ves tú: el cliente no sabe que aparece aquí.</p>`+
  (orden.map(c=>{
    const t=(c.telefono||'').replace(/[^0-9]/g,''),wa=(t.length===9?'34':'')+t;
    const rec=`Hola${c.negocio?' '+c.negocio:''}, te escribimos de Quesos Maher. ¿Te echamos una mano con el pedido de Navidad? Recuerda que el plazo para pedir acaba el 20 de noviembre.`;
    return `<div class="car ${c.gestionado?'hecho':''}"><div class="top" style="display:flex;justify-content:space-between;gap:8px"><div>
      <div class="neg ${c.negocio?'':'anon'}">${c.negocio?esc(c.negocio):'Sin nombre (aún no lo ha escrito)'}</div>
      <div class="meta">Último cambio: ${cuando(c.actualizado)}${c.entrega?' · '+esc(c.entrega):''}</div></div>
      ${c.gestionado?'<span class="tag">Gestionado</span>':'<span class="tag mira">Sin enviar</span>'}</div>
      <ul>${(c.lineas||[]).map(l=>`<li><b>${esc(cant(l,+l.q))}</b> · ${esc(l.n)} <span class="meta">(${esc(l.d)} · ${esc(l.m)})</span></li>`).join('')}</ul>
      <div class="cto">${t?`<a class="btn" href="tel:${esc(c.telefono)}">📞 ${esc(c.telefono)}</a><a class="btn wa" href="https://wa.me/${wa}?text=${encodeURIComponent(rec)}" target="_blank" rel="noopener">Recordarle por WhatsApp</a>`:'<span class="meta">Sin teléfono todavía</span>'}
      ${c.gestionado?`<button class="btn" data-car="${esc(c.visitante)}" data-si="0">Volver a pendientes</button>`:`<button class="btn" data-car="${esc(c.visitante)}" data-si="1">Ya lo he gestionado</button>`}</div></div>`}).join('')||'<p class="vacio">Ahora mismo no hay ningún carrito sin enviar. 👍</p>');
}
$('tcar').addEventListener('click',async e=>{const b=e.target.closest('button[data-car]');if(!b)return;b.disabled=true;
  try{await rpc('web_panel_carrito_gestionado',{clave:CLAVE,vis:b.dataset.car,si:b.dataset.si==='1'});await cargar()}catch(err){toast(err.message);b.disabled=false}});
// ---- pestaña "Han visto la tienda" ----
let VIS=[],VFIL='todos';
const nn=t=>norm(t).replace(/[^a-z0-9ñ]+/g,' ').trim();
function cuando(d){const f=new Date(d),h=new Date();const dia=f.toDateString()===h.toDateString()?'hoy':(new Date(h-864e5).toDateString()===f.toDateString()?'ayer':f.toLocaleDateString('es-ES',{day:'numeric',month:'short'}));
  return dia+' a las '+f.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}
function pintarVis(){
  if(VIS===null){$('tvis').innerHTML='<p class="vacio">No se han podido cargar las visitas. Pulsa ↻ Actualizar.</p>';return}
  const pedNom=new Set(PED.filter(p=>p.estado!=='anulado').map(p=>nn(p.negocio)));
  const con=VIS.filter(v=>v.negocio),anon=VIS.filter(v=>!v.negocio).length;
  con.forEach(v=>{v.pidio=v.pedidos>0||(v.nombres||[v.negocio]).some(n=>pedNom.has(nn(n)))});
  const nPed=con.filter(v=>v.pidio).length;
  const lista=con.filter(v=>VFIL==='todos'||(VFIL==='sin'?!v.pidio:v.pidio));
  $('tvis').innerHTML=`<div class="vkp"><div class="kpi"><b>${con.length}</b><span>han entrado</span></div><div class="kpi"><b>${nPed}</b><span>han pedido</span></div><div class="kpi"><b>${con.length-nPed}</b><span>solo han mirado</span></div></div>
  <div class="vfil" role="group" aria-label="Filtrar visitas">${[['todos','Todos'],['sin','Solo han mirado'],['con','Han pedido']].map(([k,t])=>`<button type="button" data-vf="${k}" aria-pressed="${VFIL===k}">${t}</button>`).join('')}</div>
  ${lista.map(v=>{const otros=(v.nombres||[]).filter(n=>n!==v.negocio);
    return `<div class="vis ${v.pidio?'':'sinped'}"><div><div class="neg">${esc(v.negocio)}</div>
    <div class="meta">Última vez: ${cuando(v.ultima)} · ${v.entradas||1} ${(v.entradas||1)===1?'entrada':'entradas'}${(v.entradas||1)>1?` · primera: ${cuando(v.primera)}`:''}</div>
    ${otros.length?`<div class="meta">También escribió: ${otros.map(esc).join(', ')}</div>`:''}</div>
    ${v.pidio?'<span class="tag ok">Ha pedido</span>':'<span class="tag mira">Solo ha mirado</span>'}</div>`}).join('')||'<p class="vacio">Todavía no hay nadie en esta lista.</p>'}
  ${anon?`<p class="vanon">Además, ${anon} ${anon===1?'persona abrió':'personas abrieron'} la página sin llegar a poner su nombre.</p>`:''}`;
}
$('tvis').addEventListener('click',e=>{const b=e.target.closest('button[data-vf]');if(!b)return;VFIL=b.dataset.vf;pintarVis()});
$('semana').onchange=pintar;$('soloNuevos').onchange=pintar;
$('entrar').onclick=entrar;$('clave').addEventListener('keydown',e=>{if(e.key==='Enter')entrar()});
$('recargar').onclick=async()=>{try{await cargar();toast('Actualizado')}catch(e){toast(e.message)}};
// clave guardada en este móvil, o en el enlace (#k=...)
const h=new URLSearchParams(location.hash.slice(1)).get('k');if(h){history.replaceState(null,'',location.pathname)}
const cg=h||st.get('maher_panel_clave');if(cg){$('clave').value=cg;entrar()}
</script>
</body>
</html>
