<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Panel pedidos Navidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:wght@700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Panel de Mario: pedidos de Navidad guardados desde la página de clientes. Totales por proveedor para pedir a fábrica. */
:root{--bg:#f3f5f1;--card:#fff;--ink:#16241d;--muted:#5b6b62;--line:#dde4de;--pine:#103526;--pine-2:#1a4a36;--gold:#b98a2e;--holly:#a3232b;--ok:#1e7a46;--chip:#e7eee9;--new:#fbf2dc;
  --display:"Cormorant",Georgia,serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1611;--card:#13221a;--ink:#e8efe9;--muted:#9fb2a6;--line:#24372c;--pine:#0a2a1d;--pine-2:#123d2b;--gold:#e2bc69;--holly:#e0656b;--ok:#4cc27e;--chip:#1c2f24;--new:#2f2a16;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1611;--card:#13221a;--ink:#e8efe9;--muted:#9fb2a6;--line:#24372c;--pine:#0a2a1d;--pine-2:#123d2b;--gold:#e2bc69;--holly:#e0656b;--ok:#4cc27e;--chip:#1c2f24;--new:#2f2a16;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--body)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--pine);color:#f2efe4;padding:calc(14px + env(safe-area-inset-top,0px)) 0 14px}
header .wrap{display:flex;align-items:center;gap:10px;justify-content:space-between}
h1{font-family:var(--display);font-size:28px;margin:0;line-height:1.05}
header small{display:block;color:#c8d6cd;font-size:12.5px}
button,select,input{font:inherit}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--pine-2);border-color:var(--pine-2);color:#fff}
.btn.wa{background:#1ea952;border-color:#1ea952;color:#fff}
header .btn{background:transparent;color:#f2efe4;border-color:rgba(233,196,106,.5)}
.login{max-width:360px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.login label{display:block;font-weight:600;margin-bottom:6px}
.login input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px;margin-bottom:12px}
.err{color:var(--holly);font-size:13.5px;min-height:1em}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 8px}
.bar select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);max-width:100%}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:0;background:none;color:var(--muted);padding:10px 12px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.prov{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;margin-bottom:14px}
.prov h2{font-family:var(--display);font-size:24px;margin:0 0 2px}
.prov .sub{color:var(--muted);font-size:13px;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
td .f{display:block;color:var(--muted);font-size:12.5px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ped{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.ped.nuevo{background:var(--new);border-color:var(--gold)}
.ped.anulado{opacity:.55}
.ped .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ped .neg{font-weight:700;font-size:16px}
.ped .meta{color:var(--muted);font-size:12.5px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;border-radius:6px;padding:2px 7px;background:var(--chip)}
.tag.nuevo{background:var(--gold);color:#1d2a22}.tag.anulado{background:var(--holly);color:#fff}
.ped ul{margin:8px 0 0;padding-left:18px}
.ped li{margin:2px 0}
.ped .obs{margin-top:6px;font-size:13.5px;background:var(--bg);border-radius:8px;padding:6px 8px}
.vacio{color:var(--muted);text-align:center;padding:30px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pine);color:#fff;padding:10px 16px;border-radius:20px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.plazo{font-size:13px;background:var(--new);border:1px solid var(--gold);border-radius:10px;padding:7px 10px;margin:4px 0 10px}
.buscar{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--ink);font-size:16px;margin-bottom:10px}
#doc{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;color:#000}
  header,#app,#login,.toast{display:none!important}
  #doc{display:block;font:11pt/1.35 var(--body);color:#000}
  #doc .dh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #103526;padding-bottom:10px;margin-bottom:14px}
  #doc .dh img{height:46px}
  #doc h1{font-family:var(--display);font-size:26pt;margin:0;color:#103526}
  #doc .dm{text-align:right;font-size:10pt}
  #doc .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;font-size:10pt}
  #doc .two div{border:1px solid #bbb;border-radius:6px;padding:8px 10px}
  #doc .two b{display:block;font-size:8.5pt;letter-spacing:.8px;text-transform:uppercase;color:#555;margin-bottom:3px}
  #doc table{font-size:10.5pt}#doc th{color:#333;border-bottom:1.5px solid #103526}#doc td{border-bottom:1px solid #ccc}
  #doc .pie{margin-top:18px;font-size:9.5pt;color:#333}
}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header><div class="wrap"><div><h1>Pedidos de Navidad</h1><small>Panel de Quesos Maher · solo para ti</small></div><button class="btn" id="recargar" hidden>↻ Actualizar</button></div></header>

<div class="login" id="login">
  <label for="clave">Clave del panel</label>
  <input id="clave" type="password" autocomplete="current-password">
  <button class="btn pri" id="entrar" style="width:100%">Entrar</button>
  <p class="err" id="err"></p>
</div>

<main class="wrap" id="app" hidden>
  <div class="bar">
    <select id="semana" aria-label="Semana de entrega"></select>
    <label style="font-size:13.5px"><input type="checkbox" id="soloNuevos"> Solo los no marcados como pasados a fábrica</label>
  </div>
  <div class="kpis"><div class="kpi"><b id="kPed">0</b><span>pedidos</span></div><div class="kpi"><b id="kCli">0</b><span>clientes</span></div><div class="kpi"><b id="kNue">0</b><span>sin pasar a fábrica</span></div></div>
  <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-t="prov">Por proveedor</button><button role="tab" aria-selected="false" data-t="ped">Pedidos de clientes</button></div>
  <section id="tprov"></section>
  <section id="tped" hidden></section>
</main>
<div class="toast" id="toast" hidden></div>
<div id="doc"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const SB='https://ibxctgusajrpjhvvxeiq.supabase.co',SBK='sb_publishable_zGZx3EHAH6Xu62EYzlhJFQ_MsZ5304j';
const PROV=['Capdevila',"Cuit's",'La Victoria'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fq=x=>String(+(+x).toFixed(1)).replace('.',',');
const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const porDia=(a,b)=>(+(/(\d+)/.exec(a)||[0,99])[1])-(+(/(\d+)/.exec(b)||[0,99])[1]);
const hoy=()=>new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});
// Capdevila recibe pedidos los jueves antes de las 13:00 y entrega el lunes de dos semanas después
function plazoCapdevila(){
  const d=new Date(),dd=(4-d.getDay()+7)%7;let j=new Date(d.getFullYear(),d.getMonth(),d.getDate()+dd);
  if(dd===0&&d.getHours()>=13)j.setDate(j.getDate()+7);
  const l=new Date(j);l.setDate(j.getDate()+11);const f=x=>x.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  return `<div class="plazo">📅 Próximo pedido a Capdevila: <b>${f(j)} antes de las 13:00</b> · llega el ${f(l)}. Último para Navidad: jueves 10 de diciembre.</div>`;
}
// documento para imprimir o guardar en PDF (pedido de compra a fábrica u hoja de un cliente)
function imprimir(tit,quien,filas,entrega,p){
  const num=p?`Ref. ${p.ref}`:`PC-${new Date().toISOString().slice(2,10).replace(/-/g,'')}-${quien.replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()}`;
  const kg=filas.reduce((s,t)=>s+(t.l&&t.l.modo==='kg'&&t.l.peso?t.q*t.l.peso:0),0);
  $('doc').innerHTML=`<div class="dh"><div><img src="img/logo.png" alt="Quesos Maher"><h1>${tit}</h1></div><div class="dm"><b>${esc(num)}</b><br>Fecha: ${hoy()}</div></div>
  <div class="two"><div><b>${p?'Cliente':'Proveedor'}</b>${esc(quien)}${p&&p.obs?`<br><i>${esc(p.obs)}</i>`:''}</div><div><b>${p?'Servir':'Comprador'}</b>${p?esc(entrega):'Quesos Maher · Mariano Hernández Martín<br>Salamanca · WhatsApp 622 853 727<br>pedidos.quesosmaher@gmail.com'}</div></div>
  ${p?'':`<p style="margin:0 0 10px"><b>Entrega solicitada:</b> ${esc(entrega)}</p>`}
  <table><thead><tr><th>Producto</th><th>Formato</th><th style="text-align:right">Cantidad</th>${p?'<th style="text-align:right">Preparado</th>':''}</tr></thead><tbody>
  ${filas.map(t=>t.h?`<tr><td colspan="${p?4:3}" style="padding-top:12px;font-weight:700;color:#103526">${esc(t.h)}</td></tr>`:`<tr><td>${esc(t.l.n)}</td><td>${esc(t.l.d)}</td><td class="n">${esc(cant(t.l,t.q))}${t.l.modo==='kg'&&t.l.peso?`<br><small>aprox. ${fq(t.q*t.l.peso)} kg</small>`:''}</td>${p?'<td class="n">☐</td>':''}</tr>`).join('')}
  </tbody></table>${kg?`<p class="pie">Peso aproximado de las piezas: ${fq(kg)} kg.</p>`:''}
  <p class="pie">${p?'Precios según tarifa de Navidad 2026; las piezas se facturan por el peso real servido.':'Rogamos confirmación del pedido y de la fecha de entrega. Gracias.'}</p>`;
  setTimeout(()=>window.print(),150);
}
const st={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let CLAVE='',PED=[];
async function rpc(fn,body){
  const r=await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',headers:{'Content-Type':'application/json',apikey:SBK},body:JSON.stringify(body)});
  if(!r.ok){const t=await r.text();throw new Error(/clave incorrecta/.test(t)?'Clave incorrecta':'No se ha podido conectar. Prueba otra vez.')}
  const t=await r.text();return t?JSON.parse(t):null;
}
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>e.hidden=true,2200)}
async function cargar(){
  PED=await rpc('web_panel_pedidos',{clave:CLAVE})||[];
  const sems=[...new Set(PED.map(p=>p.entrega))].sort(porDia);
  const cur=$('semana').value;
  $('semana').innerHTML='<option value="">Todas las semanas</option>'+sems.map(s=>`<option ${s===cur?'selected':''}>${esc(s)}</option>`).join('');
  pintar();
}
async function entrar(){
  CLAVE=$('clave').value.trim();if(!CLAVE)return;$('err').textContent='';$('entrar').disabled=true;
  try{await cargar();st.set('maher_panel_clave',CLAVE);$('login').hidden=true;$('app').hidden=false;$('recargar').hidden=false}
  catch(e){$('err').textContent=e.message}
  $('entrar').disabled=false;
}
const unidad=(l,q)=>l.modo==='kg'?(q===1?'pieza':'piezas'):l.caja?(q===1?'caja':'cajas'):(q===1?'ud':'uds');
const cant=(l,q)=>l.modo!=='kg'&&l.caja?`${q} ${unidad(l,q)} de ${l.caja} uds (${q*l.caja} uds)`:l.modo==='kg'&&l.caja?`${q} ${unidad(l,q)} (${Math.ceil(q/l.caja)} ${Math.ceil(q/l.caja)===1?'caja':'cajas'} de ${l.caja})`:`${q} ${unidad(l,q)}`;
function visibles(){const s=$('semana').value,sn=$('soloNuevos').checked;return PED.filter(p=>p.estado!=='anulado'&&(!s||p.entrega===s)&&(!sn||p.estado==='nuevo'))}
function totales(lista){
  const T={};
  lista.forEach(p=>(p.lineas||[]).forEach(l=>{
    const m=PROV.includes(l.m)?l.m:'Otros',k=l.id||(l.n+'|'+l.d);
    T[m]=T[m]||{};const t=T[m][k]=T[m][k]||{l,q:0,cli:new Set()};t.q+=+l.q||0;t.cli.add(p.negocio);
  }));
  return T;
}
function textoProv(m,filas){
  const s=$('semana').value;
  return [`*PEDIDO ${m.toUpperCase()} - QUESOS MAHER*`,s?`Para: ${s}`:'',''].filter((x,i)=>x||i===2)
    .concat(filas.map(t=>`• ${cant(t.l,t.q)} - ${t.l.n} (${t.l.d})`)).concat(['','Mariano · Quesos Maher']).join('\n');
}
function pintar(){
  const lista=visibles();
  $('kPed').textContent=lista.length;$('kCli').textContent=new Set(lista.map(p=>p.negocio.toLowerCase())).size;$('kNue').textContent=PED.filter(p=>p.estado==='nuevo').length;
  const T=totales(lista);
  $('tprov').innerHTML=Object.keys(T).length?[...PROV,'Otros'].filter(m=>T[m]).map(m=>{
    const filas=Object.values(T[m]).sort((a,b)=>a.l.n.localeCompare(b.l.n,'es'));
    const kg=filas.reduce((s,t)=>s+(t.l&&t.l.modo==='kg'&&t.l.peso?t.q*t.l.peso:0),0);
    return `<div class="prov" data-m="${esc(m)}"><h2>${esc(m)}</h2><div class="sub">${filas.length} producto${filas.length===1?'':'s'}${kg?` · unos ${fq(kg)} kg en piezas`:''}</div>${m==='Capdevila'?plazoCapdevila():''}
    <table><thead><tr><th>Producto</th><th style="text-align:right">Total</th><th style="text-align:right">Clientes</th></tr></thead><tbody>
    ${filas.map(t=>`<tr><td>${esc(t.l.n)}<span class="f">${esc(t.l.d)}${t.l.modo==='kg'&&t.l.peso?` · aprox. ${fq(t.q*t.l.peso)} kg`:''}</span></td><td class="n">${esc(cant(t.l,t.q))}</td><td class="n">${t.cli.size}</td></tr>`).join('')}
    </tbody></table><div class="acts"><button class="btn wa" data-a="wa">Enviar por WhatsApp</button><button class="btn" data-a="copiar">Copiar texto</button><button class="btn pri" data-a="pdf">Pedido de compra (PDF)</button><button class="btn" data-a="xls">Descargar Excel</button></div></div>`}).join('')
    :'<p class="vacio">Todavía no hay pedidos para esta selección.</p>';
  const qb=norm($('buscar')?$('buscar').value:'');
  $('tped').innerHTML='<input class="buscar" id="buscar" type="search" placeholder="Buscar cliente o producto…" aria-label="Buscar pedido">'+PED.filter(p=>(!$('semana').value||p.entrega===$('semana').value)&&(!qb||norm(p.negocio+' '+p.ref+' '+(p.lineas||[]).map(l=>l.n).join(' ')).includes(qb))).map(p=>{
    const f=new Date(p.creado).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    const tag=p.estado==='nuevo'?'<span class="tag nuevo">Nuevo</span>':p.estado==='anulado'?'<span class="tag anulado">Anulado</span>':'<span class="tag">Pasado a fábrica</span>';
    return `<div class="ped ${p.estado}"><div class="top"><div><div class="neg">${esc(p.negocio)}</div><div class="meta">${esc(p.entrega)} · ${f} · Ref. ${esc(p.ref)}</div></div>${tag}</div>
    <ul>${(p.lineas||[]).map(l=>`<li><b>${esc(cant(l,+l.q))}</b> · ${esc(l.n)} <span class="meta">(${esc(l.d)} · ${esc(l.m)})</span></li>`).join('')}</ul>
    ${p.obs?`<div class="obs">${esc(p.obs)}</div>`:''}
    <div class="acts">${p.estado!=='visto'?`<button class="btn" data-id="${p.id}" data-e="visto">Marcar pasado a fábrica</button>`:`<button class="btn" data-id="${p.id}" data-e="nuevo">Volver a nuevo</button>`}
    ${p.estado!=='anulado'?`<button class="btn" data-id="${p.id}" data-e="anulado">Anular</button>`:''}<button class="btn" data-hoja="${p.id}">Hoja del pedido (PDF)</button></div></div>`}).join('')||'<p class="vacio">Todavía no hay pedidos.</p>';
}
$('tprov').addEventListener('click',async e=>{
  const b=e.target.closest('button[data-a]');if(!b)return;const m=b.closest('.prov').dataset.m;
  const filas=Object.values(totales(visibles())[m]).sort((a,b)=>a.l.n.localeCompare(b.l.n,'es'));let txt=textoProv(m,filas);
  if(!$('semana').value){const L=[`*PEDIDO ${m.toUpperCase()} - QUESOS MAHER*`];
    [...new Set(visibles().map(p=>p.entrega))].sort(porDia).forEach(se=>{const T=totales(visibles().filter(p=>p.entrega===se))[m];if(!T)return;
      L.push('',`*${se}*`);Object.values(T).sort((a,b)=>a.l.n.localeCompare(b.l.n,'es')).forEach(t=>L.push(`• ${cant(t.l,t.q)} - ${t.l.n} (${t.l.d})`))});
    txt=L.concat(['','Mariano · Quesos Maher']).join('\n')}
  if(b.dataset.a==='wa')window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank','noopener');
  if(b.dataset.a==='pdf'){
    // sin filtro de semana: el pedido de compra va separado por semana de entrega
    if($('semana').value)imprimir('PEDIDO DE COMPRA',m,filas.map(t=>({l:t.l,q:t.q})),$('semana').value,null);
    else{const sems=[...new Set(visibles().map(p=>p.entrega))].sort(porDia),out=[];
      sems.forEach(se=>{const T=totales(visibles().filter(p=>p.entrega===se))[m];if(!T)return;out.push({h:se});Object.values(T).sort((a,b)=>a.l.n.localeCompare(b.l.n,'es')).forEach(t=>out.push({l:t.l,q:t.q}))});
      imprimir('PEDIDO DE COMPRA',m,out,'por semanas, como se indica abajo',null)}
  }
  if(b.dataset.a==='copiar'){try{await navigator.clipboard.writeText(txt);toast('Texto copiado')}catch(_){prompt('Copia el texto:',txt)}}
  if(b.dataset.a==='xls'){
    if(!window.XLSX){toast('No se ha podido cargar Excel');return}
    const rows=filas.map(t=>({Producto:t.l.n,Formato:t.l.d,Cantidad:t.q,Unidad:unidad(t.l,t.q),...(t.l.caja&&t.l.modo!=='kg'?{'Total uds':t.q*t.l.caja}:{}),...(t.l.modo==='kg'&&t.l.peso?{'Kg aprox.':+(t.q*t.l.peso).toFixed(1)}:{})}));
    const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,m.replace(/[^\w ]/g,''));
    XLSX.writeFile(wb,`Pedido_${m.replace(/[^\w]/g,'')}_Navidad.xlsx`);
  }
});
$('tped').addEventListener('input',e=>{if(e.target.id!=='buscar')return;const v=e.target.value,pos=e.target.selectionStart;pintar();const n=$('buscar');n.value=v;n.focus();n.setSelectionRange(pos,pos)});
$('tped').addEventListener('click',e=>{const b=e.target.closest('button[data-hoja]');if(!b)return;const p=PED.find(x=>x.id===+b.dataset.hoja);
  imprimir('PEDIDO DE CLIENTE',p.negocio,(p.lineas||[]).map(l=>({l,q:+l.q})),p.entrega,p)});
$('tped').addEventListener('click',async e=>{
  const b=e.target.closest('button[data-e]');if(!b)return;
  if(b.dataset.e==='anulado'&&!confirm('¿Anular este pedido? Dejará de contar en los totales.'))return;
  b.disabled=true;try{await rpc('web_panel_estado',{clave:CLAVE,pedido:+b.dataset.id,nuevo_estado:b.dataset.e});await cargar()}catch(err){toast(err.message);b.disabled=false}
});
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));$('tprov').hidden=b.dataset.t!=='prov';$('tped').hidden=b.dataset.t!=='ped'});
$('semana').onchange=pintar;$('soloNuevos').onchange=pintar;
$('entrar').onclick=entrar;$('clave').addEventListener('keydown',e=>{if(e.key==='Enter')entrar()});
$('recargar').onclick=async()=>{try{await cargar();toast('Actualizado')}catch(e){toast(e.message)}};
// clave guardada en este móvil, o en el enlace (#k=...)
const h=new URLSearchParams(location.hash.slice(1)).get('k');if(h){history.replaceState(null,'',location.pathname)}
const cg=h||st.get('maher_panel_clave');if(cg){$('clave').value=cg;entrar()}
</script>
